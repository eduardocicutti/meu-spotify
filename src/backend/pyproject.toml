[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meu-spotify-backend"
version = "0.1.0"
description = "Meu Spotify - Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-mock>=3.12",
    "faker>=25.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20", "PT", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["E501", "B008", "C901", "T201", "ARG001", "ARG002"]
per-file-ignores = { "tests/*" = ["T201", "S101", "ARG001", "ARG002"], "scripts/*" = ["T201", "S101"], "migrations/*" = ["T201", "S101", "ERA001"] }
format.quote-style = "single"
format.indent-style = "space"
format.line-ending = "lf"
format.docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*", "alembic.*"]
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--tb=short"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*", "scripts/*", "app/main.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.alembic]
script_location = "migrations"
sqlalchemy.url = "postgresql+asyncpg://user:pass@localhost:5432/meuSpotify"